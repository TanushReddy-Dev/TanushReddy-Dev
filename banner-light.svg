<svg width="800" height="160" viewBox="0 0 800 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Subtle dot pattern for the background -->
    <pattern id="dots-light" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#9ca3af" opacity="0.3" />
    </pattern>
  </defs>

  <!-- Center Box Background -->
  <rect x="120" y="30" width="560" height="100" fill="url(#dots-light)" />

  <!-- Architectural Grid Lines -->
  <line x1="0" y1="30" x2="800" y2="30" stroke="#e5e7eb" stroke-width="1" />
  <line x1="0" y1="130" x2="800" y2="130" stroke="#e5e7eb" stroke-width="1" />
  <line x1="120" y1="0" x2="120" y2="160" stroke="#e5e7eb" stroke-width="1" />
  <line x1="680" y1="0" x2="680" y2="160" stroke="#e5e7eb" stroke-width="1" />

  <!-- Registration Marks (Crosshairs) -->
  <path d="M115 30 H125 M120 25 V35" stroke="#9ca3af" stroke-width="1" />
  <path d="M675 30 H685 M680 25 V35" stroke="#9ca3af" stroke-width="1" />
  <path d="M115 130 H125 M120 125 V135" stroke="#9ca3af" stroke-width="1" />
  <path d="M675 130 H685 M680 125 V135" stroke="#9ca3af" stroke-width="1" />

  <!-- Center Name -->
  <text x="400" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56px" font-weight="800" fill="#111827" letter-spacing="-1.5px" text-anchor="middle">Tanush Reddy</text>
</svg>

<svg width="800" height="160" viewBox="0 0 800 160" xmlns="http://www.w3.org/2000/svg">
  <!-- Elegant slow-moving abstract waves (Dark Mode) -->

  <path d="M0,80 Q200,30 400,80 T800,80" fill="none" stroke="#8b949e" stroke-width="1.5" opacity="0.3">
    <animate attributeName="d"
             values="M0,80 Q200,30 400,80 T800,80;
                     M0,80 Q200,130 400,80 T800,80;
                     M0,80 Q200,30 400,80 T800,80"
             dur="12s" repeatCount="indefinite" />
  </path>

  <path d="M0,80 Q200,110 400,80 T800,80" fill="none" stroke="#8b949e" stroke-width="1.5" opacity="0.2">
    <animate attributeName="d"
             values="M0,80 Q200,110 400,80 T800,80;
                     M0,80 Q200,50 400,80 T800,80;
                     M0,80 Q200,110 400,80 T800,80"
             dur="9s" repeatCount="indefinite" />
  </path>

  <path d="M0,80 Q200,140 400,80 T800,80" fill="none" stroke="#8b949e" stroke-width="1.5" opacity="0.15">
    <animate attributeName="d"
             values="M0,80 Q200,140 400,80 T800,80;
                     M0,80 Q200,20 400,80 T800,80;
                     M0,80 Q200,140 400,80 T800,80"
             dur="15s" repeatCount="indefinite" />
  </path>

  <!-- Center Name -->
  <text x="400" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56px" font-weight="800" fill="#c9d1d9" letter-spacing="-1.5px" text-anchor="middle">Tanush Reddy</text>
</svg>

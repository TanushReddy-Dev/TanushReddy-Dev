<svg width="800" height="160" viewBox="0 0 800 160" xmlns="http://www.w3.org/2000/svg">
  <!-- Central text -->
  <text x="400" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56px" font-weight="800" fill="#c9d1d9" letter-spacing="-1.5px" text-anchor="middle">Tanush Reddy</text>

  <!-- Floating geometric shapes in tech stack colors -->
  <!-- Top left Python blue -->
  <circle cx="200" cy="40" r="8" fill="#3776AB" opacity="0.6">
    <animate attributeName="cy" values="40;25;40" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- Left middle TypeScript blue -->
  <rect x="120" y="80" width="12" height="12" rx="3" fill="#3178C6" opacity="0.5">
    <animate attributeName="y" values="80;95;80" dur="7s" repeatCount="indefinite" />
  </rect>

  <!-- Bottom left small dot -->
  <circle cx="260" cy="120" r="4" fill="#58A6FF" opacity="0.35">
    <animate attributeName="cy" values="120;105;120" dur="4s" repeatCount="indefinite" />
  </circle>

  <!-- Top right Kotlin purple -->
  <rect x="620" y="35" width="10" height="10" rx="2" fill="#7F52FF" opacity="0.5" transform="rotate(45 625 40)">
    <animate attributeName="y" values="35;48;35" dur="6s" repeatCount="indefinite" />
  </rect>

  <!-- Right middle Tailwind cyan -->
  <circle cx="680" cy="90" r="7" fill="#06B6D4" opacity="0.5">
    <animate attributeName="cy" values="90;105;90" dur="8s" repeatCount="indefinite" />
  </circle>

  <!-- Bottom right Google blue -->
  <rect x="560" y="115" width="11" height="11" rx="3" fill="#4285F4" opacity="0.45">
    <animate attributeName="y" values="115;100;115" dur="6.5s" repeatCount="indefinite" />
  </rect>
</svg>

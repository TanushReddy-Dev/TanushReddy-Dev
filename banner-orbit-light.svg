<svg width="800" height="240" viewBox="0 0 800 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Center orbit system -->
  <g transform="translate(400, 120)">
    <!-- Outer Orbit -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="40s" repeatCount="indefinite" />
      <ellipse cx="0" cy="0" rx="320" ry="90" fill="none" stroke="#e5e7eb" stroke-width="1.5" />
      <circle cx="320" cy="0" r="3.5" fill="#0969da" opacity="0.8" />
    </g>
    <!-- Middle Orbit -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="60;420" dur="30s" repeatCount="indefinite" />
      <ellipse cx="0" cy="0" rx="270" ry="70" fill="none" stroke="#e5e7eb" stroke-width="1.5" />
      <circle cx="-270" cy="0" r="3" fill="#0969da" opacity="0.9" />
    </g>
    <!-- Inner Orbit -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="135;495" dur="20s" repeatCount="indefinite" />
      <ellipse cx="0" cy="0" rx="220" ry="50" fill="none" stroke="#e5e7eb" stroke-width="1.5" />
      <circle cx="0" cy="50" r="4" fill="#0969da" />
    </g>
  </g>

  <!-- Typography -->
  <text x="400" y="95" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12px" font-weight="600" fill="#6e7781" letter-spacing="3px" text-anchor="middle">BUILDING WITH AI &amp; PYTHON</text>
  <text x="400" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64px" font-weight="800" fill="#24292f" letter-spacing="-1.5px" text-anchor="middle">Tanush Reddy</text>
</svg>

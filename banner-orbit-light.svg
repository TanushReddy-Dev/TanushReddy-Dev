<svg width="800" height="240" viewBox="0 0 800 240" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(400, 120)">
    <!-- Outer -->
    <g transform="rotate(10)">
      <path d="M -280,0 A 280,70 0 1,0 280,0 A 280,70 0 1,0 -280,0" fill="none" stroke="#e5e7eb" stroke-width="1.5" />
      <circle r="3.5" fill="#0969da" opacity="0.8">
        <animateMotion dur="20s" repeatCount="indefinite" path="M -280,0 A 280,70 0 1,0 280,0 A 280,70 0 1,0 -280,0" />
      </circle>
    </g>
    <!-- Middle -->
    <g transform="rotate(-15)">
      <path d="M -230,0 A 230,55 0 1,0 230,0 A 230,55 0 1,0 -230,0" fill="none" stroke="#e5e7eb" stroke-width="1.5" />
      <circle r="3" fill="#0969da" opacity="0.9">
        <animateMotion dur="15s" repeatCount="indefinite" path="M -230,0 A 230,55 0 1,0 230,0 A 230,55 0 1,0 -230,0" />
      </circle>
    </g>
    <!-- Inner -->
    <g transform="rotate(25)">
      <path d="M -170,0 A 170,40 0 1,0 170,0 A 170,40 0 1,0 -170,0" fill="none" stroke="#e5e7eb" stroke-width="1.5" />
      <circle r="4" fill="#0969da">
        <animateMotion dur="10s" repeatCount="indefinite" path="M -170,0 A 170,40 0 1,0 170,0 A 170,40 0 1,0 -170,0" />
      </circle>
    </g>
  </g>

  <!-- Typography -->
  <text x="400" y="95" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12px" font-weight="600" fill="#6e7781" letter-spacing="3px" text-anchor="middle">BUILDING WITH AI &amp; PYTHON</text>
  <text x="400" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64px" font-weight="800" fill="#24292f" letter-spacing="-1.5px" text-anchor="middle">Tanush Reddy</text>
</svg>
